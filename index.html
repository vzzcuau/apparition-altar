<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talk to the Virgin — Apparition</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Noto+Serif+JP&display=swap');

    :root {
      --bg: #060d0d;
      --teal: #2a7a6e;
      --teal-light: #3aada0;
      --gold: #c9a84c;
      --cream: #f0e6d0;
      --dim: #7a9a95;
      --glow-teal: rgba(42, 122, 110, 0.25);
      --glow-gold: rgba(201, 168, 76, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--cream);
      font-family: 'IM Fell English', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 3rem;
    }

    .altar {
      max-width: 640px;
      width: 100%;
      text-align: center;
    }

    /* VIRGIN IMAGE */
    .virgin-container {
      position: relative;
      width: 280px;
      margin: 0 auto 1.5rem;
    }

    .virgin-img {
      width: 100%;
      display: block;
      border-radius: 4px;
      filter: saturate(1.1) contrast(1.05);
      animation: float 6s ease-in-out infinite;
    }

    .virgin-glow {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 30%, rgba(255, 220, 80, 0.18) 0%, rgba(42, 122, 110, 0.12) 50%, transparent 75%);
      animation: pulse 4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    /* HEADER */
    .title {
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      color: var(--teal-light);
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    .virgin-name {
      font-size: 2.4rem;
      font-style: italic;
      color: var(--cream);
      margin-bottom: 0.5rem;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 1rem;
      color: var(--dim);
      font-style: italic;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .divider {
      width: 80px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--teal), transparent);
      margin: 0 auto 2rem;
    }

    /* STAGES */
    #stage-email {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
    }

    #stage-email p {
      font-size: 1rem;
      color: var(--dim);
      font-style: italic;
      line-height: 1.7;
      max-width: 420px;
    }

    input[type="email"] {
      background: transparent;
      border: 1px solid rgba(42, 122, 110, 0.5);
      color: var(--cream);
      font-family: 'IM Fell English', serif;
      font-size: 1.05rem;
      padding: 0.85rem 1.5rem;
      width: 100%;
      max-width: 380px;
      text-align: center;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input[type="email"]::placeholder { color: var(--dim); }

    input[type="email"]:focus {
      border-color: var(--teal-light);
      box-shadow: 0 0 16px var(--glow-teal);
    }

    button {
      background: transparent;
      border: 1px solid rgba(201, 168, 76, 0.5);
      color: var(--gold);
      font-family: 'IM Fell English', serif;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.85rem 2.2rem;
      cursor: pointer;
      transition: background 0.3s, color 0.3s, box-shadow 0.3s;
    }

    button:hover {
      background: var(--glow-gold);
      color: var(--cream);
      box-shadow: 0 0 20px var(--glow-gold);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* STAGE 2 */
    #stage-wish {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    #stage-wish p {
      font-size: 1rem;
      color: var(--dim);
      font-style: italic;
      line-height: 1.7;
    }

    textarea {
      background: transparent;
      border: 1px solid rgba(42, 122, 110, 0.4);
      color: var(--cream);
      font-family: 'IM Fell English', serif;
      font-size: 1.05rem;
      padding: 1.1rem 1.4rem;
      width: 100%;
      max-width: 500px;
      min-height: 130px;
      resize: vertical;
      outline: none;
      line-height: 1.7;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    textarea::placeholder { color: var(--dim); }

    textarea:focus {
      border-color: var(--teal-light);
      box-shadow: 0 0 16px var(--glow-teal);
    }

    /* STAGE 3 — response */
    #stage-response {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .response-label {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      color: var(--teal-light);
      text-transform: uppercase;
      opacity: 0.8;
    }

    /* SPEECH BUBBLE */
    .speech-bubble {
      position: relative;
      background: rgba(42, 122, 110, 0.08);
      border: 1px solid rgba(42, 122, 110, 0.35);
      padding: 1.8rem 2rem;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 0 30px var(--glow-teal), inset 0 0 20px rgba(42, 122, 110, 0.05);
    }

    .speech-bubble::before {
      content: '';
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 12px solid rgba(42, 122, 110, 0.35);
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-bottom: 11px solid #060d0d;
    }

    .response-text {
      font-size: 1.15rem;
      font-style: italic;
      color: var(--cream);
      line-height: 2;
      text-align: center;
    }

    /* CTA BUTTONS AFTER RESPONSE */
    .cta-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      max-width: 500px;
      margin-top: 0.5rem;
    }

    .cta-label {
      font-size: 0.72rem;
      color: var(--dim);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .cta-btn-primary {
      width: 100%;
      border-color: rgba(42, 122, 110, 0.6);
      color: var(--teal-light);
      font-size: 0.85rem;
      padding: 0.9rem 1.5rem;
    }

    .cta-btn-primary:hover {
      background: var(--glow-teal);
      color: var(--cream);
      box-shadow: 0 0 20px var(--glow-teal);
    }

    .cta-btn-gold {
      width: 100%;
      border-color: rgba(201, 168, 76, 0.5);
      color: var(--gold);
      font-size: 0.85rem;
      padding: 0.9rem 1.5rem;
    }

    .cta-divider {
      width: 40px;
      height: 1px;
      background: rgba(122, 154, 149, 0.2);
      margin: 0.25rem 0;
    }

    .share-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 0.25rem;
    }

    .share-btn {
      font-size: 0.72rem;
      padding: 0.5rem 1.2rem;
      border-color: rgba(122, 154, 149, 0.3);
      color: var(--dim);
    }

    .share-btn:hover {
      color: var(--cream);
      box-shadow: none;
      background: rgba(122, 154, 149, 0.1);
    }

    .error-msg {
      font-size: 0.8rem;
      color: #c47a7a;
      font-style: italic;
    }

    .film-link {
      margin-top: 3rem;
      font-size: 0.7rem;
      color: var(--dim);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .film-link a {
      color: var(--dim);
      text-decoration: none;
      border-bottom: 1px solid rgba(122, 154, 149, 0.3);
      padding-bottom: 1px;
      transition: color 0.2s, border-color 0.2s;
    }

    .film-link a:hover {
      color: var(--teal-light);
      border-color: var(--teal-light);
    }

    /* CONTACT FORM */
    .contact-form {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      margin-top: 0.25rem;
    }

    .contact-form.open {
      display: flex;
    }

    .contact-form input[type="text"],
    .contact-form textarea {
      min-height: unset;
      font-size: 0.9rem;
      padding: 0.75rem 1rem;
      max-width: 100%;
      width: 100%;
    }

    .contact-form button {
      width: 100%;
    }

    .contact-success {
      font-size: 0.9rem;
      font-style: italic;
      color: var(--teal-light);
    }

  </style>
</head>
<body>

<div class="altar">

  <!-- VIRGIN IMAGE -->
  <div class="virgin-container">
    <div class="virgin-glow"></div>
    <img class="virgin-img" src="virgin.png" alt="La Virgen de Tokio" />
  </div>

  <p class="title">The Digital Altar</p>
  <h1 class="virgin-name">Talk to the Virgin</h1>
  <p class="subtitle">Make a wish or set an intention.</p>
  <div class="divider"></div>

  <!-- STAGE 1: email gate -->
  <div id="stage-email">
    <p>Leave your email and enter the altar.</p>
    <input type="email" id="email-input" placeholder="your@email.com" autocomplete="email" />
    <button id="email-btn" onclick="submitEmail()">Get Your Message</button>
    <span id="email-error" class="error-msg"></span>
  </div>

  <!-- STAGE 2: wish -->
  <div id="stage-wish">
    <p>She is listening.</p>
    <textarea id="wish-input" placeholder="Make a wish, ask a question, or tell her what you're afraid of…"></textarea>
    <button id="wish-btn" onclick="submitWish()">Speak</button>
    <span id="wish-error" class="error-msg"></span>
  </div>

  <!-- STAGE 3: response -->
  <div id="stage-response">
    <span class="response-label">She speaks</span>

    <div class="speech-bubble">
      <p class="response-text" id="response-text"></p>
    </div>

    <div class="cta-section">

      <span class="cta-label">— what calls to you —</span>

      <a href="https://www.youtube.com/watch?v=fAKwDm3W7PE" target="_blank" style="width:100%">
        <button class="cta-btn-primary" style="width:100%">Watch the Film That Started It All</button>
      </a>

      <a href="https://poetictoolbox.com/coaching" target="_blank" style="width:100%">
        <button class="cta-btn-gold" style="width:100%">Make Your Dream Project Happen</button>
      </a>

      <div class="cta-divider"></div>

      <button class="share-btn" onclick="toggleContact()" id="contact-toggle-btn">Let's Talk →</button>

      <div class="contact-form" id="contact-form">
        <input type="text" id="contact-name" placeholder="Your name" />
        <input type="text" id="contact-msg" placeholder="What's on your mind?" style="min-height:unset" />
        <button onclick="submitContact()">Send</button>
        <span id="contact-success" class="contact-success" style="display:none">She received your message. So did Cuau.</span>
      </div>

      <div class="cta-divider"></div>

      <div class="share-row">
        <button class="share-btn" onclick="copyResponse()">Copy her words</button>
        <button class="share-btn" onclick="askAnother()">Ask another question</button>
      </div>

    </div>
  </div>

  <p class="film-link">
    From the short film <a href="https://apparition-film.com" target="_blank">Apparition</a>
  </p>

</div>

<script>
  let userEmail = "";

  function showStage(name) {
    document.getElementById("stage-email").style.display = "none";
    document.getElementById("stage-wish").style.display = "none";
    document.getElementById("stage-response").style.display = "none";
    document.getElementById("stage-" + name).style.display = "flex";
  }

  function submitEmail() {
    const email = document.getElementById("email-input").value.trim();
    const errorEl = document.getElementById("email-error");
    if (!email || !email.includes("@")) {
      errorEl.textContent = "A real email, please. She insists.";
      return;
    }
    errorEl.textContent = "";
    userEmail = email;
    showStage("wish");
  }

  async function submitWish() {
    const wish = document.getElementById("wish-input").value.trim();
    const errorEl = document.getElementById("wish-error");
    const btn = document.getElementById("wish-btn");

    if (!wish) {
      errorEl.textContent = "She cannot answer what has not been asked.";
      return;
    }

    errorEl.textContent = "";
    btn.disabled = true;
    btn.textContent = "Your message is being channeled…";

    try {
      const res = await fetch("/.netlify/functions/virgin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ wish, email: userEmail }),
      });

      if (!res.ok) throw new Error("no response");

      const data = await res.json();
      document.getElementById("response-text").textContent = data.response;
      showStage("response");

    } catch (e) {
      errorEl.textContent = "The connection to the beyond is temporarily disrupted. Try again.";
      btn.disabled = false;
      btn.textContent = "Speak";
    }
  }

  function copyResponse() {
    const text = document.getElementById("response-text").textContent;
    const shareText = text + "\n\n— La Virgen de Tokio, from the film Apparition\napparition-film.com";
    navigator.clipboard.writeText(shareText).then(() => {
      const btn = event.target;
      btn.textContent = "Copied";
      setTimeout(() => { btn.textContent = "Copy her words"; }, 2000);
    });
  }

  function askAnother() {
    document.getElementById("wish-input").value = "";
    showStage("wish");
  }

  function toggleContact() {
    const form = document.getElementById("contact-form");
    form.classList.toggle("open");
  }

  async function submitContact() {
    const name = document.getElementById("contact-name").value.trim();
    const msg = document.getElementById("contact-msg").value.trim();
    if (!name || !msg) return;

    const mailto = `mailto:cuau@poetictoolbox.com?subject=From the altar — ${encodeURIComponent(name)}&body=${encodeURIComponent(msg)}`;
    window.location.href = mailto;

    document.getElementById("contact-success").style.display = "block";
    document.getElementById("contact-toggle-btn").style.display = "none";
  }

  document.getElementById("email-input").addEventListener("keydown", function(e) {
    if (e.key === "Enter") submitEmail();
  });
</script>

</body>
</html>
